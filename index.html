        hiza[0] = 6;
        for (i = n - 1, j = boyut - 7; i >= 1; i--, j -= adim) hiza[i] = j;
      }
      for (i = 0; i < hiza.length; i++)
        for (j = 0; j < hiza.length; j++) {
          if ((i === 0 && j === 0) || (i === 0 && j === hiza.length - 1) || (i === hiza.length - 1 && j === 0)) continue;
          for (y = -2; y <= 2; y++)
            for (x = -2; x <= 2; x++) isle(hiza[i] + x, hiza[j] + y, Math.max(Math.abs(x), Math.abs(y)) !== 1);
        }
      bicimYaz(0);
      if (v >= 7) {
        var kal = v;
        for (i = 0; i < 12; i++) kal = (kal << 1) ^ ((kal >>> 11) * 0x1F25);
        var sb = v << 12 | kal;
        for (i = 0; i < 18; i++) {
          var p = boyut - 11 + i % 3, q = Math.floor(i / 3);
          isle(p, q, bit(sb, i)); isle(q, p, bit(sb, i));
        }
      }

      // kod sözcükleri
      i = 0;
      for (var sag = boyut - 1; sag >= 1; sag -= 2) {
        if (sag === 6) sag = 5;
        for (var dikey = 0; dikey < boyut; dikey++)
          for (j = 0; j < 2; j++) {
            x = sag - j;
            y = ((sag + 1) & 2) === 0 ? boyut - 1 - dikey : dikey;
            if (!islev[y][x] && i < kod.length * 8) {
              m[y][x] = bit(kod[i >>> 3], 7 - (i & 7));
              i++;
            }
          }
      }

      // en düşük cezalı maske
      var enIyi = 0, enAz = Infinity;
      for (i = 0; i < 8; i++) {
        maskele(i); bicimYaz(i);
        var c = ceza();
        if (c < enAz) { enAz = c; enIyi = i; }
        maskele(i);
      }
      maskele(enIyi); bicimYaz(enIyi);
      return m;
    }

    // Uygulamadaki kuralla aynı: sürüm en az QR_SURUM; M düzeyine sığmıyorsa L.
    function uret(metin) {
      var veri = Array.prototype.slice.call(new TextEncoder().encode(metin));
      var g = gereken(veri.length, 1), e = g > 0 && g <= QR_SURUM ? 1 : 0;
      var v = gereken(veri.length, e);
      if (v === 0) return null;
      v = Math.max(v, QR_SURUM);
      var kapasite = veriKod(v, e) * 8, bitler = [], i;
      function ekle(deger, uzunluk) { for (var n = uzunluk - 1; n >= 0; n--) bitler.push((deger >>> n) & 1); }
      ekle(4, 4);
      ekle(veri.length, v < 10 ? 8 : 16);
      veri.forEach(function (b) { ekle(b, 8); });
      ekle(0, Math.min(4, kapasite - bitler.length));
      ekle(0, (8 - bitler.length % 8) % 8);
      for (var dolgu = 0xEC; bitler.length < kapasite; dolgu ^= 0xEC ^ 0x11) ekle(dolgu, 8);
      var kod = [];
      for (i = 0; i < bitler.length; i += 8) {
        var b = 0;
        for (var n = 0; n < 8; n++) b = b << 1 | bitler[i + n];
        kod.push(b);
      }
      return matris(v, e, duzeltmeEkle(kod, v, e));
    }

    return { uret: uret };
  })();

  // ------------------------------------------------------------------ etiket çizimi (80 x 40 mm, 8 nokta/mm)

  function ciz(tuval, e, logo, qrMetni) {
    // k: yazıcı noktası başına piksel; ekran yoğunluğuna göre seçilir
    var k = Math.max(2, Math.min(5, Math.ceil(tuval.clientWidth * (window.devicePixelRatio || 1) / 640)));
    tuval.width = 640 * k;
    tuval.height = 320 * k;
    var g = tuval.getContext("2d");
    function N(mm) { return Math.round(mm * NOKTA_MM) * k; }
    function yazi(punto, kalin) { g.font = (kalin ? "bold " : "") + punto + "px Arial, Helvetica, 'Liberation Sans', sans-serif"; }
    function genislik(s) { return g.measureText(s).width; }

    function bol(metin, en, zorla) {
      var satirlar = [], satir = "";
      var sozcukler = metin.split(" ").filter(function (s) { return s.length > 0; });
      for (var i = 0; i < sozcukler.length; i++) {
        var kalan = sozcukler[i];
        while (kalan.length > 0) {
          var aday = satir.length === 0 ? kalan : satir + " " + kalan;
          if (genislik(aday) <= en) { satir = aday; break; }
          if (satir.length > 0) { satirlar.push(satir); satir = ""; continue; }
          if (!zorla) return null;
          var n = Math.max(1, kalan.length - 1);
          while (n > 1 && genislik(kalan.substring(0, n)) > en) n--;
          satirlar.push(kalan.substring(0, n));
          kalan = kalan.substring(n);
        }
      }
      if (satir.length > 0) satirlar.push(satir);
      return satirlar;
    }
    // Metni kutuya sığan en büyük puntoda satırlara böler; en küçük puntoda da sığmazsa sonunu keser.
    function sigdir(metin, en, boy, enBuyukMm, enKucukMm, enCokSatir) {
      for (var punto = N(enBuyukMm); ; punto -= k) {
        yazi(punto, true);
        var son = punto <= N(enKucukMm), satirlar = bol(metin, en, son);
        if (satirlar && satirlar.length === 0) satirlar.push("");
        if (son && satirlar.length > enCokSatir) {
          satirlar.length = enCokSatir;
          var s = satirlar[enCokSatir - 1];
          while (s.length > 1 && genislik(s + "…") > en) s = s.substring(0, s.length - 1);
          satirlar[enCokSatir - 1] = s.replace(/\s+$/, "") + "…";
        }
        if (satirlar && satirlar.length <= enCokSatir && (son || (BUYUK_HARF + (satirlar.length - 1) * SATIR_ARALIGI) * punto <= boy))
          return { punto: punto, satirlar: satirlar };
      }
    }
    function blok(metin, x, y, en, boy, enBuyukMm, enKucukMm, enCokSatir, hiza) {
      var s = sigdir(metin, en, boy, enBuyukMm, enKucukMm, enCokSatir);
      var adim = SATIR_ARALIGI * s.punto, yukseklik = BUYUK_HARF * s.punto + (s.satirlar.length - 1) * adim;
      var taban = y + Math.max(0, boy - yukseklik) * hiza + BUYUK_HARF * s.punto;
      yazi(s.punto, true);
      s.satirlar.forEach(function (satir) { g.fillText(satir, x, Math.round(taban)); taban += adim; });
    }
    function baslik(metin, x, ust) {
      yazi(N(2.0), false);
      g.fillText(metin, x, ust + Math.round(BUYUK_HARF * N(2.0)));
    }

    g.fillStyle = "#fff";
    g.fillRect(0, 0, tuval.width, tuval.height);
    g.textBaseline = "alphabetic";
    g.lineJoin = "miter";

    // üst bant: logo + tür kutusu
    var ust = N(2), bant = N(7.5);
    if (logo && logo.naturalWidth) {
      var logoEn = N(40), logoBoy = Math.round(logoEn * logo.naturalHeight / logo.naturalWidth);
      g.imageSmoothingQuality = "high";
      g.drawImage(logo, N(2.5), ust + (bant - logoBoy) / 2, logoEn, logoBoy);
    }
    var kx = N(44.5), kEn = N(33), dolu = e.tur !== 0;
    g.fillStyle = "#000";
    g.fillRect(kx, ust, kEn, bant);
    if (!dolu) { g.fillStyle = "#fff"; g.fillRect(kx + N(0.5), ust + N(0.5), kEn - 2 * N(0.5), bant - 2 * N(0.5)); }
    var renk = dolu ? "#fff" : "#000";
    g.fillStyle = renk;
    g.strokeStyle = renk;

    var bosluk = N(1.25), kenar = bant - 2 * bosluk, sx = kx + N(1.5), sy = ust + bosluk;
    g.beginPath();
    if (e.tur === 0) {          // düz sac
      g.lineWidth = N(0.5);
      g.moveTo(sx + kenar * 0.3, sy + kenar * 0.24); g.lineTo(sx + kenar, sy + kenar * 0.24);
      g.lineTo(sx + kenar * 0.7, sy + kenar * 0.76); g.lineTo(sx, sy + kenar * 0.76);
      g.closePath();
    } else if (e.tur === 1) {   // U profil kesiti
      g.lineWidth = N(0.75);
      var a = N(0.375);
      g.moveTo(sx + a, sy + kenar * 0.08); g.lineTo(sx + a, sy + kenar - a - kenar * 0.06);
      g.lineTo(sx + kenar - a, sy + kenar - a - kenar * 0.06); g.lineTo(sx + kenar - a, sy + kenar * 0.08);
    } else {                    // somun
      g.lineWidth = N(0.625);
      var mx = sx + kenar / 2, my = sy + kenar / 2, yaricap = kenar / 2 - N(0.25);
      for (var i = 0; i < 6; i++) g[i ? "lineTo" : "moveTo"](mx + yaricap * Math.cos(i * Math.PI / 3), my + yaricap * Math.sin(i * Math.PI / 3));
      g.closePath();
      g.moveTo(mx + yaricap * 0.42, my);
      g.arc(mx, my, yaricap * 0.42, 0, Math.PI * 2);
    }
    g.stroke();

    var tx = sx + kenar + N(1.4), tEn = kx + kEn - N(1.2) - tx, ad = TURLER[e.tur][0], aciklama = TURLER[e.tur][1];
    var buyuk = sigdir(ad, tEn, bant, aciklama ? 3.6 : 4.6, 2.0, 1);
    if (!aciklama) {
      yazi(buyuk.punto, true);
      g.fillText(ad, tx, ust + Math.round((bant + BUYUK_HARF * buyuk.punto) / 2));
    } else {
      var alt = sigdir(aciklama, tEn, bant, 2.2, 1.5, 1);
      var h1 = BUYUK_HARF * buyuk.punto, h2 = BUYUK_HARF * alt.punto, ara = N(1.0);
      var y0 = ust + Math.round((bant - (h1 + ara + h2)) / 2 + N(0.15));
      yazi(buyuk.punto, true);
      g.fillText(ad, tx, y0 + Math.round(h1));
      yazi(alt.punto, true);
      g.fillText(aciklama, tx, y0 + Math.round(h1 + ara + h2));
    }

    g.fillStyle = "#000";
    g.fillRect(N(2.5), N(10.5), N(75), N(0.375));

    // QR
    var qr = Qr.uret(qrMetni);
    if (qr) {
      var n = qr.length, modul = Math.max(1, Math.floor(QR_ALAN / n)) * k, boyut = n * modul;
      var x0 = N(77.5) - boyut, yq = N(12.5) + (QR_ALAN * k - boyut) / 2;
      for (var qy = 0; qy < n; qy++)
        for (var qx = 0; qx < n; qx++)
          if (qr[qy][qx]) g.fillRect(x0 + qx * modul, yq + qy * modul, modul, modul);
    }

    // alanlar
    var sol = N(2.5), metinEn = N(47.5);
    baslik("ÜRÜN ADI", sol, N(11.9));
    blok(e.urun, sol, N(14.5), metinEn, N(8.6), 6.4, 2.6, 2, 0.3);
    baslik("PROJE", sol, N(24.5));
    blok(e.proje, sol, N(26.7), metinEn, N(2.75), 3.8, 2.2, 1, 1.0);
    baslik("ADET", sol, N(31.2));
    if (e.tur === 2) {
      blok(e.adet, sol, N(33.25), metinEn, N(3.75), 5.2, 2.6, 1, 1.0);
    } else {
      blok(e.adet, sol, N(33.25), N(15.5), N(3.75), 4.8, 2.4, 1, 1.0);
      baslik("MALZEME", N(19.5), N(31.2));
      var m = sigdir(e.malzeme, N(30.5), N(4.7), 3.6, 2.1, 2);
      var taban = m.satirlar.length === 1 ? N(37.0) : N(38.25) - Math.round(SATIR_ARALIGI * m.punto);
      yazi(m.punto, true);
      m.satirlar.forEach(function (satir) { g.fillText(satir, N(19.5), taban); taban += Math.round(SATIR_ARALIGI * m.punto); });
    }
  }

  // ------------------------------------------------------------------ sayfa

  function ekle(ust, etiket, sinif, metin) {
    var el = document.createElement(etiket);
    if (sinif) el.className = sinif;
    if (metin !== undefined) el.textContent = metin;
    ust.appendChild(el);
    return el;
  }

  function goster() {
    var icerik = document.getElementById("icerik"), e = coz();
    icerik.textContent = "";
    if (!e) {
      var bos = ekle(icerik, "div", "bos");
      ekle(bos, "b", "", "Etiket bilgisi bulunamadı");
      ekle(bos, "span", "", "Bu sayfa, ürün etiketinin üzerindeki QR kod okutulduğunda etiketi gösterir.");
      return;
    }
    document.title = (e.urun || "Etiket") + " – Stark Mounting";
    var tuval = ekle(icerik, "canvas");
    tuval.setAttribute("role", "img");
    tuval.setAttribute("aria-label", TURLER[e.tur][0] + " etiketi: " + e.urun);

    var liste = ekle(icerik, "dl");
    function satir(ad, deger, ek) {
      var d = ekle(liste, "div");
      ekle(d, "dt", "", ad);
      var dd = ekle(d, "dd", "", deger || "—");
      if (ek) ekle(dd, "small", "", ek);
    }
    satir("ETİKET TÜRÜ", TURLER[e.tur][0], TURLER[e.tur][1]);
    satir("ÜRÜN ADI", e.urun);
    satir("PROJE", e.proje);
    satir("ADET", e.adet);
    if (e.tur !== 2) satir("MALZEME", e.malzeme);
    ekle(icerik, "p", "", "Bu sayfa etiketin üzerindeki QR koddan açılmıştır; bilgiler etiketin basıldığı andaki hâlidir.");

    var logo = document.getElementById("logo");
    function yenidenCiz() { ciz(tuval, e, logo, location.href); }
    if (logo.complete) yenidenCiz(); else logo.addEventListener("load", yenidenCiz);
    window.addEventListener("resize", yenidenCiz);
  }

  window.addEventListener("hashchange", function () { location.reload(); });
  goster();
})();
</script>
